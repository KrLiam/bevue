<props>
    <resource type="Counter"/>
</props>

<template>
    <div class="window">
        <div class="root">
            <p>Hello! {{ counter.seconds }}s</p>
            <p v-if="counter.even">Even second</p>
            <p v-else>Odd second</p>
            <div class="button" @click="add_item()">
                <span>Add item</span>
            </div>
            <div class="item" v-for="item in counter.items" :key="item">
                <span>{{ label(item) }}</span>
            </div>
        </div>
    </div>
</template>

    width: 100%;
    height: 100%;
    padding: 50px;
