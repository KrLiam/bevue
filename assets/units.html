<props>
    <resource type="Selection"/>
    <query name="units" data="Name, Health, Target?" with="Unit" order-by="health.current desc, name"/>
</props>

<template>
    <div class="window">
        <div class="list">
            <button
                v-for="u in units"
                :key="u.entity"
                class="row"
                :class="{ selected: u.entity == selection.entity, low: u.health.current * 3 < u.health.max }"
                @click="select(u.entity)"
            >
                {{ u.name }}: {{ u.health.current }}/{{ u.health.max }}
            </button>
        </div>

        <div v-if="selection.entity" class="panel">
            <p>{{ selection.entity.@Name }}</p>
            <p>Health: {{ selection.entity.@Health.current }}/{{ selection.entity.@Health.max }}</p>
            <p v-if="selection.entity.@Target">
                Attacking {{ selection.entity.@Target.@Name }} ({{ @Health(selection.entity.@Target).current }} hp)
            </p>
            <button class="row" @click="select()">Close</button>
        </div>
        <p v-else class="panel">Click a unit</p>
    </div>
</template>

<style>
* {
    color: white;
}
.window {
    width: 100%;
    height: 100%;
    padding: 50px;
    column-gap: 30px;
    align-items: start;
}
.list,
.panel {
    flex-direction: column;
    row-gap: 8px;
    padding: 20px;
    background-color: #333;
}
.row {
    padding: 6px;
    background-color: #444;
}
.row:hover {
    background-color: #36357a;
}
.selected {
    background-color: #2d6a4f;
}
.low {
    color: #f28b82;
}
</style>
