<props>
    <component name="menu" type="example::types::ContextMenu"/>
</props>

<layout>    
    <div class="context-menu-root">
        <div class="wrapper">
            <div class="separator">
                <p class="context-menu-title">{{menu.title}}</p>
            </div>
            <button v-for="action in menu.actions" :key="action.id">
                <span>{{action.label}}</span>
            </button>
        </div>
    </div>
</layout>

<style src="context_menu.css">
</style>
