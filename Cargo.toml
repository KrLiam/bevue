[package]
name = "bevue"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/bevue_macros"]

[dependencies]
bevue_macros = { path = "crates/bevue_macros", version = "0.1.0" }
bevy = { version = "0.19", default-features = false, features = [
    "ui",
    "file_watcher",
]}
bevy_flair = { version = "0.8.1" }
tl = "0.7.8"
winnow = "1.0.4"
