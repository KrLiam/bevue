[package]
name = "bevue"
version = "0.2.0-dev"
edition = "2024"
description = "Vue-like templating for Bevy UI"
repository="https://github.com/krliam/bevue"
license = "MIT"
readme = "README.md"
keywords=["bevy", "ui", "vue", "reactivity"]
exclude = ["/plans", "/docs", "/todo.md", "/.github"]

[workspace]
members = ["crates/bevue_macros"]

[dependencies]
bevue_macros = { path = "crates/bevue_macros", version = "0.2.0-dev" }
bevy = { version = "0.19", default-features = false, features = [
    "ui",
    "file_watcher",
]}
bevy_flair = { version = "0.8.1" }
tl = "^0.7.8"
winnow = "^1.0.3"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "reactivity"
harness = false
